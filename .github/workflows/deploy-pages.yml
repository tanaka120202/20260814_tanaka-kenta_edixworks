name: Deploy websites to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare websites
        shell: bash
        run: |
          mkdir -p public

          find . \
            -mindepth 2 \
            -maxdepth 2 \
            -type f \
            -name "index.html" \
            -print0 |
          while IFS= read -r -d '' index_file; do
            site_dir="$(dirname "$index_file")"
            site_name="$(basename "$site_dir")"

            echo "Publishing: $site_name"

            cp -a "$site_dir" "public/$site_name"
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload websites
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4